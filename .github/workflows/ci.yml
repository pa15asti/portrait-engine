name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: gofmt
        run: |
          out="$(gofmt -l -s .)"
          if [ -n "$out" ]; then echo "unformatted files:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          # Build the linter with the runner's Go toolchain instead of pulling a
          # prebuilt binary: the published v1 binaries are built with go1.24 and
          # refuse a module targeting a newer Go than themselves.
          install-mode: goinstall

  test:
    name: Unit tests (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race -count=1 ./...

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # ubuntu-latest ships Docker, which testcontainers uses to spin up
      # Postgres, NATS, and MinIO.
      - name: Integration tests
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: go test -tags=integration -race -count=1 -timeout=600s ./...

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build api image
        run: docker build --build-arg BIN=api -t portrait-engine-api:ci .
      - name: Build worker image
        run: docker build --build-arg BIN=worker -t portrait-engine-worker:ci .
